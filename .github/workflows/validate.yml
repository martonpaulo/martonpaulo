# The gate: the repository text checks and the card script's syntax, in seconds, with nothing to
# install. It runs `make validate`, the same command a commit runs locally.
name: Validate

on:
  push:
    branches: [main]
    # Every path runs the gate, so a new file is never skipped (fleet-conventions validate-paths).
    paths:
      - "**"
  pull_request:
    # Every path runs the gate, so a new file is never skipped (fleet-conventions validate-paths).
    paths:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Validate
        run: make validate
