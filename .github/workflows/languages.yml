name: Languages card

# Redraws assets/languages-*.svg from the GitHub API. Weekly is plenty: the
# shares move slowly, and a stale week costs nothing.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/scripts/languages.mjs
      - .github/workflows/languages.yml

permissions:
  contents: read

concurrency:
  group: languages
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    # The job commits the redrawn card, so only its token may write.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Draw the card
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/languages.mjs
      - name: Commit if it changed
        run: |
          git add assets
          if git diff --cached --quiet; then
            echo "Card unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: redraw the languages card"
          git push
