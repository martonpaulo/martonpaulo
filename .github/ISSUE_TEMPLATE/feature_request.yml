name: Feature request
description: Propose a focused change to the GitHub profile.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What does the profile miss or get wrong today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should the profile show instead?
    validations:
      required: true
