<style>
text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
.title { font-size: 15px; font-weight: 600; fill: #f0f6fc; }
.name { font-size: 12px; fill: #f0f6fc; }
.share { font-size: 12px; fill: #9198a1; font-variant-numeric: tabular-nums; }
</style>
<text x="20" y="30" class="title">Most used languages</text>
<clipPath id="bar"><rect x="20" y="48" width="320" height="8" rx="4"/></clipPath>
<rect x="20" y="48" width="320" height="8" rx="4" fill="#262c36"/>
<g clip-path="url(#bar)"><rect x="20.00" y="48" width="226.83" height="8" fill="#3178c6"/><rect x="246.83" y="48" width="72.00" height="8" fill="#F05138"/><rect x="318.83" y="48" width="18.62" height="8" fill="#f1e05a"/><rect x="337.45" y="48" width="2.55" height="8" fill="#8b949e"/></g>
